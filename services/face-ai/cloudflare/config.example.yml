# cloudflared named-tunnel config for the Face-AI service.
#
# Copy to  ~/.cloudflared/config.yml  (Windows: C:\Users\<you>\.cloudflared\config.yml)
# and fill in the two placeholders after `cloudflared tunnel create face-ai`.
#
# Topology:  Render backend ──HTTPS──► face-ai.<your-domain> ──tunnel──► localhost:9000
#
# The tunnel gives the local AI box a stable public HTTPS hostname WITHOUT
# opening any inbound port or exposing your IP — cloudflared makes an outbound
# connection to Cloudflare's edge and traffic is proxied back down it.

tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: REPLACE_WITH_PATH_TO/<TUNNEL_ID>.json

# Optional niceties
originRequest:
  connectTimeout: 10s
  # face-ai is plain HTTP on localhost; the public edge is still HTTPS.
  noTLSVerify: true

ingress:
  # Public hostname (create the DNS route with:
  #   cloudflared tunnel route dns face-ai face-ai.<your-domain>)
  - hostname: face-ai.REPLACE_WITH_YOUR_DOMAIN
    service: http://localhost:9000
  # Everything else 404s (required catch-all).
  - service: http_status:404
