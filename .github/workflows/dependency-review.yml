name: Dependency review

# Scans dependency manifest changes in a PR and fails if it introduces a
# dependency with a known high-or-worse advisory — the same bar as the blocking
# `pnpm audit --audit-level=high` / `pip-audit` gates in ci.yml, but caught at
# review time on the diff itself and summarized inline on the PR. Relies on the
# GitHub dependency graph, which is available on this public repo.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
