name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  lint-frontend:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Biome replaces the old prettier + root eslint pair (format + lint in one).
      - name: Biome (format + lint)
        run: pnpm exec biome ci .
      # eslint-config-next is kept for the Next.js/React rules Biome does not
      # cover (no-img-element, no-html-link-for-pages, react-hooks/*).
      #
      # Blocking. The 28-error backlog this surfaced when it was first
      # enabled is cleared: the escaping and next/link errors were fixed, and
      # each set-state-in-effect site carries a justification for why an
      # effect is correct there (browser-only reads, device lifecycle).
      - name: Next.js lint
        run: pnpm --filter web lint

  build-frontend:
    name: Build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      # A broken frontend build used to reach main undetected — this is the gate.
      - run: pnpm --filter web build

  typecheck-frontend:
    name: Typecheck (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p apps/web/tsconfig.json

  test-frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web test

  lint-python:
    name: Lint (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check .

  test-backend:
    name: Test (backend)
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: config.settings_test
      SECRET_KEY: test-ci-secret-key-1234567890-placeholder
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            platform/requirements.txt
            platform/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          APP_ENV: production
          ALLOWED_HOSTS: example.com
        continue-on-error: true
      - run: pytest

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Two scans, because one is not enough. The action runs with
      # --log-opts=-1 on a push, i.e. it inspects exactly ONE commit: a secret
      # committed earlier, or anywhere but the tip of a multi-commit push, is
      # invisible to it. That gap let a live Telegram token and Gemini key sit
      # in this repo from 2026-07-19 to 2026-08-26 behind a green Security scan.
      - name: Secret scan (gitleaks, pushed commits)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
      # The backstop: scan every tracked file as it stands right now, whatever
      # commit introduced it. Rules and verified-false-positive allowlist live
      # in .gitleaks.toml / .gitleaksignore. Blocking on purpose.
      - name: Secret scan (gitleaks, full working tree)
        run: |
          docker run --rm -v "$PWD:/repo"             zricethezav/gitleaks:v8.24.3             dir /repo --no-banner --redact -v --exit-code 1             --config /repo/.gitleaks.toml
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Blocking on purpose. dependabot.yml holds every semver-major bump, and
      # ignore rules suppress security PRs too -- so a vulnerability whose only
      # fix ships in a new major reaches nobody unless this gate fails the
      # build. Suppress an unfixable advisory by id in package.json
      # pnpm.auditConfig.ignoreGhsas, never by neutering the step.
      - name: JS dependency audit
        run: pnpm audit --audit-level=high
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Blocking for the same reason as the JS audit above. Suppress an
      # unfixable advisory by adding its id to --ignore-vuln.
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r platform/requirements.txt --ignore-vuln GHSA-none
