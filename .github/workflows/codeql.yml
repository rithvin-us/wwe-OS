name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
    steps:
      - uses: actions/checkout@v7

      # NOTE: the input is `languages` (plural). Passing `language` is silently
      # ignored, which makes CodeQL fall back to auto-detection — that picked up
      # the Capacitor Android Java/Kotlin sources and failed the run with
      # "CodeQL could not process any code written in Java/Kotlin".
      #
      # build-mode: none is correct for both of these: neither needs a compile
      # step, and it stops CodeQL trying to infer one.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
