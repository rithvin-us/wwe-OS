# Local gates. Every hook here pins its own tool so the result never depends
# on which interpreter happens to be on PATH — the previous `language: system`
# ruff hooks silently failed with "No module named ruff" whenever a venv was
# active, which meant the Python gate was not actually running.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.10
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.10"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
        exclude: ^(pnpm-lock\.yaml|.*\.svg)$
      - id: trailing-whitespace
        exclude: ^(pnpm-lock\.yaml|.*\.md)$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^\.vscode/|^.*\.jsonc$
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
