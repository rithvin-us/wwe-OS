name: business-operations-platform

# Local development infrastructure only.
# Application services are added here as they are implemented.
# Production deployment: see infrastructure/ (Render, Vercel, Cloudflare).

services:
  postgres:
    image: postgres:16-alpine
    container_name: bop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bop}
      POSTGRES_DB: ${POSTGRES_DB:-bop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bop-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Local SMTP sink + web UI for testing email-service output.
    image: axllent/mailpit:latest
    container_name: bop-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  backend:
    # Platform kernel (Django). Migrations + seeding run on start.
    build: ./platform
    container_name: bop-backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in your .env (see .env.example)}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bop}:${POSTGRES_PASSWORD:-bop}@postgres:5432/${POSTGRES_DB:-bop}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      INGESTION_SERVICE_TOKENS: ${INGESTION_SERVICE_TOKENS:?Set INGESTION_SERVICE_TOKENS in your .env (see .env.example)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
    volumes:
      - ./platform:/app
      - ./modules:/modules
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram-bot:
    # Purchase-bill ingestion channel: Telegram -> OCR -> platform.
    build: ./services/telegram-bot
    container_name: bop-telegram-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in your .env (see .env.example)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OCR_MODEL: ${OCR_MODEL:-gemini-2.5-flash}
      PLATFORM_API_URL: http://backend:8000
      # Must match one "name:token" pair in the backend's
      # INGESTION_SERVICE_TOKENS above.
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?Set PLATFORM_SERVICE_TOKEN in your .env (see .env.example)}
    volumes:
      - ./services/telegram-bot:/app
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
