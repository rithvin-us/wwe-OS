[project]
name = "business-operations-platform"
version = "0.0.0"
description = "Enterprise Business Operations Platform — Python backend workspace"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "pre-commit>=4",
]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", ".venv", "database/backups", "**/migrations/**", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# platform + modules need the Django env in platform/.venv, not this root
# tooling env — run those via `cd platform && pytest` (see platform/pytest.ini).
testpaths = [
    "services",
    "tests",
]
python_files = "test_*.py"
addopts = "-q"
