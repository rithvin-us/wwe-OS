<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WWE OS</title>
    <!--
      Served by the service worker only when a navigation fails offline.
      Styles are inline because the stylesheet may not be cached, and the
      colours are the resolved sRGB values of the --background / --foreground
      / --primary design tokens rather than new ones.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f7fdff;
        color: #12242d;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #090d10;
          color: #e7eef2;
        }
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.6;
        opacity: 0.75;
      }
      img {
        width: 48px;
        height: 48px;
        margin: 0 0 1.25rem;
        border-radius: 12px;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: #fff;
        background: #008cba;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>
        This page needs a connection because it shows live company data. Reconnect and try again —
        nothing you had open has been lost.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
