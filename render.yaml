# Render Infrastructure Blueprint for WWE OS
# Documentation: https://render.com/docs/yaml

services:
  # 1. Platform Kernel API (Django Backend)
  - type: web
    name: wwe-os-backend
    env: python
    region: singapore
    plan: free
    rootDir: platform
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        sync: false # Set to your Supabase PostgreSQL transaction pooler string
      - key: CORS_ALLOWED_ORIGINS
        value: https://wwe-os.vercel.app
      # Service-to-service ingestion secret (Telegram bot → backend). MUST be
      # in "name:token" format — see platform/shared/service_auth.py, which
      # skips any entry without a colon. generateValue produces a bare string
      # with no "name:" prefix, so it CANNOT be used here. Set manually to:
      #   telegram-bot:<LONG_RANDOM_SECRET>
      # and give the bot's PLATFORM_SERVICE_TOKEN the <LONG_RANDOM_SECRET> half.
      - key: INGESTION_SERVICE_TOKENS
        sync: false
      # OCR and Rithu AI run through the platform AI gateway ON THE BACKEND
      # (platform/ai), so the API needs the Gemini key too — not just the
      # Telegram bot. Without it, bulk invoice-import OCR and PO parsing fall
      # back to a low-confidence stub. Same key as the bot/scheduler.
      - key: GEMINI_API_KEY
        sync: false

  # 2. Telegram Ingestion Bot (Worker Service)
  - type: worker
    name: wwe-os-telegram-bot
    env: python
    region: singapore
    plan: free
    rootDir: services/telegram-bot
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Full base URL of the backend. `fromService … property: host` returns a
      # scheme-less host (wwe-os-backend.onrender.com), which httpx rejects
      # (the bot passes this straight into httpx.AsyncClient). Set the full
      # https URL — matches vercel_env's INTERNAL_API_URL. Swap for a custom
      # domain if you front the backend with one.
      - key: PLATFORM_API_URL
        value: https://wwe-os-backend.onrender.com
      # The token half of the backend's INGESTION_SERVICE_TOKENS. If the
      # backend has INGESTION_SERVICE_TOKENS=telegram-bot:SECRET, set this to
      # SECRET (the bot sends "Authorization: Service SECRET"). Cannot be
      # auto-wired from the backend: the backend value carries a "telegram-bot:"
      # prefix that must NOT be sent by the bot.
      - key: PLATFORM_SERVICE_TOKEN
        sync: false

  # 3. Pipeline scheduler (Worker Service)
  # Drains background workflow runs one step at a time — the async OCR for bulk
  # invoice import, and automation's packaging/report pipelines. WITHOUT THIS
  # SERVICE, queued OCR jobs never advance and imported scans stay "reading"
  # forever. It shares the backend's database and Gemini key; it does NOT run
  # migrations (the web service owns those). A Render Cron Job running the
  # one-shot `python manage.py pipeline_tick` each minute is an equivalent,
  # cheaper alternative if you prefer per-minute latency over an always-on loop.
  - type: worker
    name: wwe-os-scheduler
    env: python
    region: singapore
    plan: free
    rootDir: platform
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py pipeline_tick --loop
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Point at the SAME database the web service uses (the Supabase pooler
      # string). The scheduler advances rows the API created.
      - key: DATABASE_URL
        sync: false
      # OCR runs here too — needs the same Gemini key as the backend.
      - key: GEMINI_API_KEY
        sync: false
